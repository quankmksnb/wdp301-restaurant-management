services:
  rms-backend:
    container_name: rms-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - rms-shared-network

networks:
  rms-shared-network:
    external: true